function dl(t,n,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()}
function vBkp(){const cs=[...new Set([...S.p.map(p=>p.categoria).filter(Boolean),...Object.keys(S.c||{})])].sort();
$('main').innerHTML=`<div class=ph><h2>Ajustes</h2></div><div class=pn><p>Dados salvos na nuvem (Supabase). Conta: <b>${esc(USR)}</b> · ${esc($('#st').textContent||'—')}</p><h3>Operadores</h3><p>Dê um nome a cada operador: é esse nome que aparece no histórico. Para criar uma conta nova, use Authentication → Users no Supabase.</p><div id=perf><p class=em>Carregando…</p></div><h3>Locais do estoque</h3><p>Use o lápis para renomear ou o ✕ para remover (só se não houver produtos nele).</p><div class=chips>${LOC().map(l=>`<span class=lc>${esc(l)}<button class=ib data-l="${esc(l)}" title="Renomear" onclick="edLoc(this.dataset.l)">${ic('edit',14)}</button><button class="ib dg" data-l="${esc(l)}" title="Remover" onclick="rmLoc(this.dataset.l)">✕</button></span>`).join('')}</div><div class=g><input id=nl placeholder="Novo local (ex.: Armário 4)"><button onclick="addLoc2()">＋ Adicionar local</button></div><h3>Local padrão por categoria</h3><p>Ao cadastrar um produto da categoria, o app sugere esse local.</p>${cs.map(c=>`<div class=g><input value="${esc(c)}" disabled><select data-c="${esc(c)}" onchange="setLoc(this.dataset.c,this.value)">${locOpts((S.c||{})[c]||'',1)}</select><button class=ib style="flex:none" data-c="${esc(c)}" title="Renomear" onclick="edCat(this.dataset.c)">${ic('edit',16)}</button><button class="ib dg" style="flex:none" data-c="${esc(c)}" title="Excluir" onclick="rmCat(this.dataset.c)">✕</button></div>`).join('')}<div class=g><input id=nc placeholder="Nova categoria"><select id=ncl>${locOpts('',1)}</select><button onclick="addCat()">＋ Adicionar categoria</button></div>
<h3>Caixas e lacres</h3><p>Cada caixa é um local do estoque. O operador precisa abrir a caixa (informando o lacre) para registrar entrada ou saída dos itens dela.</p><div id=cxa><p class=em>Carregando…</p></div><h3>Exportar</h3><div class=g><button class=o onclick="csv([['nome','codigo','categoria','unidade','qtd','min','fornecedor','local'],...S.p.map(p=>[p.nome,p.codigo,p.categoria,p.unidade,p.qtd,p.min,p.fornecedor,p.local])],'produtos')">Produtos</button><button class=o onclick="csv([['data','produto','tipo','qtd','saldo','usuario','obs'],...S.m.map(m=>[fd(m.data),m.nome,TL[m.tipo],m.qtd,m.saldo,m.usuario,m.obs])],'movimentacoes')">Movimentações</button><button class=o onclick="dl(JSON.stringify(S),'copia-completa.json','application/json')">Cópia completa</button></div>
<h3>Restaurar cópia completa</h3><input type=file accept=.json onchange="rest(this.files[0])"><h3>Conta</h3><button class="o dg" onclick="sair()">Sair da conta</button></div>`;loadPerf();loadCx()}
async function loadPerf(){const el=$('#perf');if(!el)return;try{PERF=await api('/rest/v1/perfis?select=user_id,email,nome,papel,ativo&order=papel,email');
el.innerHTML=PERF.map(x=>`<div style="border:1px solid var(--bo);border-radius:12px;padding:10px;margin-bottom:8px"><b>${esc(x.email||'—')}</b> <span class="bd ${x.ativo?'':'zero'}">${x.papel=='admin'?'Administrador':x.ativo?'Operador':'Desativado'}</span><div class=g style="margin-top:8px"><input data-u="${x.user_id}" value="${esc(x.nome||'')}" placeholder="Nome (ex.: Maria Souza)" onchange="setNome(this.dataset.u,this.value)">${x.papel=='admin'?'':`<button class="o ${x.ativo?'dg':''}" style="flex:none" data-u="${x.user_id}" onclick="togAtivo(this.dataset.u)">${x.ativo?'Desativar':'Reativar'}</button>`}</div></div>`).join('')||'<p class=em>Nenhuma conta encontrada.</p>'}
catch(e){el.innerHTML='<p class=em>Não foi possível carregar os operadores: '+esc(e.message)+'</p>'}}
async function setNome(u,v){try{await api('/rest/v1/perfis?user_id=eq.'+u,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({nome:v.trim()})});toast('Nome salvo.')}catch(e){toast('Não foi possível salvar o nome: '+e.message)}}
function togAtivo(u){const x=PERF.find(p=>p.user_id==u);if(!x)return;const nm=esc(x.nome||x.email);ask(x.ativo?'Desativar <b>'+nm+'</b>? A pessoa perde o acesso agora e o histórico dela é mantido.':'Reativar o acesso de <b>'+nm+'</b>?',async()=>{try{await api('/rest/v1/perfis?user_id=eq.'+u,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({ativo:!x.ativo})});toast(x.ativo?'Operador desativado.':'Operador reativado.');loadPerf()}catch(e){toast('Não foi possível alterar: '+e.message)}},x.ativo?'Desativar':'Reativar')}
const LOC=()=>[...new Set([...(S.l||[]),...S.p.map(p=>p.local).filter(Boolean)])].sort((a,b)=>a.localeCompare(b));
const locOpts=(sel,nn)=>'<option value="">— sem local —</option>'+LOC().map(l=>`<option ${l==sel?'selected':''}>${esc(l)}</option>`).join('')+(nn?'':'<option value="__n">＋ Adicionar novo local…</option>');
function addLoc(n){if(!LOC().includes(n)){(S.l=S.l||[]).push(n);dlo.add(n);save()}}
function novoLoc(el){if(el.value!='__n')return;el.value='';modal('<h3>Novo local</h3><input id=nlm placeholder="Ex.: Armário 4"><div class=g><button class=o onclick="fechar()">Cancelar</button><button onclick="gravaLoc()">Adicionar</button></div>');setTimeout(()=>$('#nlm').focus(),50)}
function gravaLoc(){const n=$('#nlm').value.trim();if(!n)return toast('Digite o nome do local.');addLoc(n);fechar();const s=$('#f8');if(s){s.innerHTML=locOpts(n);s.value=n}}
function addLoc2(){const n=$('#nl').value.trim();if(!n)return;addLoc(n);vBkp()}
function edCat(c){modal(`<h3>Renomear categoria</h3><input id=nlm value="${esc(c)}"><p class=em style="padding:0 0 10px">Os produtos desta categoria serão atualizados.</p><div class=g><button class=o onclick="fechar()">Cancelar</button><button data-c="${esc(c)}" onclick="gravaCat(this.dataset.c)">Salvar</button></div>`);setTimeout(()=>$('#nlm').focus(),50)}
function gravaCat(o){const n=$('#nlm').value.trim();if(!n)return toast('Digite o nome da categoria.');if(n==o)return fechar();S.c=S.c||{};S.p.forEach(p=>{if(p.categoria==o)p.categoria=n});if(!S.c[n])S.c[n]=S.c[o]||'';delete S.c[o];dxc.add(o);dxc.delete(n);dc.delete(o);dc.add(n);save();fechar();vBkp();toast('Categoria salva.')}
function rmCat(c){const k=S.p.filter(p=>p.categoria==c).length;ask('Excluir a categoria <b>'+esc(c)+'</b>?'+(k?' '+k+' produto(s) ficarão sem categoria.':''),()=>{S.p.forEach(p=>{if(p.categoria==c)p.categoria=''});delete (S.c||{})[c];dxc.add(c);dc.delete(c);save();vBkp();toast('Categoria excluída.')},'Excluir')}
function edLoc(l){modal(`<h3>Renomear local</h3><input id=nlm value="${esc(l)}"><p class=em style="padding:0 0 10px">Produtos e categorias que usam este local serão atualizados.</p><div class=g><button class=o onclick="fechar()">Cancelar</button><button data-l="${esc(l)}" onclick="gravaEd(this.dataset.l)">Salvar</button></div>`);setTimeout(()=>$('#nlm').focus(),50)}
function gravaEd(o){const n=$('#nlm').value.trim();if(!n)return toast('Digite o nome do local.');if(n==o)return fechar();S.p.forEach(p=>{if(p.local==o)p.local=n});Object.keys(S.c||{}).forEach(k=>{if(S.c[k]==o){S.c[k]=n;dc.add(k)}});S.l=(S.l||[]).filter(x=>x!=o);if(!S.l.includes(n))S.l.push(n);dxl.add(o);dxl.delete(n);dlo.add(n);if(cxDe(o))api('/rest/v1/rpc/renomear_caixa',{method:'POST',body:JSON.stringify({p_antigo:o,p_novo:n})}).then(carregaCx).catch(e=>toast('Local renomeado, mas a caixa/lacre não: '+e.message));save();fechar();vBkp();toast('Local salvo.')}
function rmLoc(l){if(S.p.some(p=>p.local==l))return toast('Não dá para remover: há produtos neste local.');if(cxDe(l))return toast('Este local é uma caixa com lacre. Remova a caixa em "Caixas e lacres" primeiro.');ask('Remover o local <b>'+esc(l)+'</b>?',()=>{S.l=(S.l||[]).filter(x=>x!=l);dxl.add(l);Object.keys(S.c||{}).forEach(k=>{if(S.c[k]==l){S.c[k]='';dc.add(k)}});save();vBkp()},'Remover')}
function addCat(){const n=$('#nc').value.trim();if(!n)return toast('Digite o nome da categoria.');if(n in(S.c||{}))return toast('Essa categoria já existe.');setLoc(n,$('#ncl').value);vBkp()}
function setLoc(c,v){(S.c=S.c||{})[c]=v.trim();dc.add(c);save();toast('Local padrão salvo.')}
function rest(f){if(!f)return;f.text().then(t=>{let d;try{d=JSON.parse(t);if(!d.p||!d.m)throw 0}catch(e){return toast('Restauração não concluída: arquivo inválido.')}ask('Substituir todos os dados atuais pela cópia?',()=>{S=d;S.c=S.c||{};S.m.forEach(x=>dm.add(x.id));Object.keys(S.c).forEach(k=>dc.add(k));(S.l=S.l||[]).forEach(n=>dlo.add(n));save();render();toast('Cópia restaurada.')},'Substituir')})}
function fp(){const q=norm(busca);return S.p.filter(p=>!q||[p.nome,p.codigo,p.categoria,p.local].some(x=>norm(x).includes(q))).sort((x,y)=>x.nome.localeCompare(y.nome))}

const cxDe=l=>l?CX.find(c=>c.local==l):null,selada=l=>{const c=cxDe(l);return !!c&&!c.aberta};
const ha=ms=>{const m=Math.max(0,Math.round((Date.now()-ms)/60000));return m<1?'agora':m<60?'há '+m+' min':m<1440?'há '+Math.floor(m/60)+' h':'há '+Math.floor(m/1440)+' dia(s)'};
async function carregaCx(){try{const r=await api('/rest/v1/rpc/listar_caixas',{method:'POST',body:'{}'});if(Array.isArray(r))CX=r.map(c=>({...c,aberta_em:c.aberta_em==null?null:+c.aberta_em}))}catch(e){}}
function cxAviso(){const a=CX.filter(c=>c.aberta||c.divergente);if(!a.length)return'';return a.map(c=>`<div class="al ${c.divergente?'dv':''}">${c.divergente?'⚠ ':'🔓 '}<b>${esc(c.local)}</b> aberta por ${esc(c.aberta_por||'—')} ${c.aberta_em?ha(c.aberta_em):''}${c.divergente?' — o lacre informado <b>não conferia</b> com o registrado.':'.'}</div>`).join('')}
function vCaixas(){$('main').innerHTML=`<div class=ph><h2>Caixas</h2></div><div class=pn><p>Para retirar ou repor itens de uma caixa lacrada, primeiro <b>abra</b> a caixa informando o número do lacre que você rompeu. Ao terminar, <b>feche</b> informando o número do lacre novo.</p></div><div id=cxl>${CX.map(c=>`<div class="cx ${c.divergente?'dv':c.aberta?'ab':''}"><h4>${c.aberta?'🔓':'🔒'} ${esc(c.local)}</h4><small>${S.p.filter(p=>p.local==c.local).length} item(ns) nesta caixa</small>${c.aberta?`<small class=lk>Aberta por ${esc(c.aberta_por||'—')} ${c.aberta_em?ha(c.aberta_em):''}</small>`:'<small>Lacrada</small>'}<div class=g>${c.aberta?`<button data-l="${esc(c.local)}" onclick="pedeFecha(this.dataset.l)">Fechar com lacre novo</button>`:`<button data-l="${esc(c.local)}" onclick="pedeAbre(this.dataset.l)">Abrir caixa</button>`}</div></div>`).join('')||`<div class=em>${ic('box',34)}<p>Nenhuma caixa cadastrada ainda.</p></div>`}</div>`}
function pedeAbre(l){modal(`<h3>Abrir caixa</h3><p><b>${esc(l)}</b></p><label>Número do lacre que você está rompendo</label><input id=lc autocomplete=off placeholder="Confira o número impresso no lacre"><div class=g><button class=o onclick="fechar()">Cancelar</button><button data-l="${esc(l)}" onclick="abreCx(this.dataset.l)">Abrir</button></div>`);setTimeout(()=>$('#lc')&&$('#lc').focus(),50)}
function pedeFecha(l){modal(`<h3>Fechar caixa</h3><p><b>${esc(l)}</b></p><label>Número do lacre NOVO que você colocou</label><input id=lc autocomplete=off placeholder="Número do novo lacre"><p class=em style="padding:0">O número não pode ter sido usado antes.</p><div class=g><button class=o onclick="fechar()">Cancelar</button><button data-l="${esc(l)}" onclick="fechaCx(this.dataset.l)">Fechar caixa</button></div>`);setTimeout(()=>$('#lc')&&$('#lc').focus(),50)}
async function abreCx(l){const v=($('#lc').value||'').trim();if(!v)return toast('Informe o número do lacre que você está rompendo.');if(busy)return;busy=1;try{const r=await api('/rest/v1/rpc/abrir_caixa',{method:'POST',body:JSON.stringify({p_local:l,p_lacre:v})});fechar();await carregaCx();render();toast(r&&r.divergente?'Caixa aberta, mas o lacre informado não confere com o registrado. O administrador será avisado.':'Caixa aberta. Registre as retiradas e depois feche a caixa.')}catch(e){toast('Não foi possível abrir a caixa: '+e.message)}finally{busy=0}}
async function fechaCx(l){const v=($('#lc').value||'').trim();if(!v)return toast('Informe o número do novo lacre.');if(busy)return;busy=1;try{await api('/rest/v1/rpc/fechar_caixa',{method:'POST',body:JSON.stringify({p_local:l,p_novo:v})});fechar();await carregaCx();render();toast('Caixa fechada com o lacre novo.')}catch(e){toast('Não foi possível fechar a caixa: '+e.message)}finally{busy=0}}
function bloqCx(p){modal(`<h3>Caixa lacrada</h3><p><b>${esc(p.nome)}</b> está na caixa <b>${esc(p.local)}</b>, que está lacrada. Abra a caixa informando o lacre antes de registrar entrada ou saída.</p><div class=g><button class=o onclick="fechar()">Cancelar</button><button data-l="${esc(p.local)}" onclick="pedeAbre(this.dataset.l)">Abrir caixa</button></div>`)}
async function loadCx(){const el=$('#cxa');if(!el)return;try{await carregaCx();const h=await api('/rest/v1/lacre_historico?select=*&order=data.desc&limit=60');CXH=h;
const livres=LOC().filter(l=>!cxDe(l));
const lab={cadastro:'Cadastrada',abertura:'Aberta',fechamento:'Fechada',remocao:'Removida'};
el.innerHTML=(CX.map(c=>`<div class="cx ${c.divergente?'dv':c.aberta?'ab':''}"><h4>${c.aberta?'🔓':'🔒'} ${esc(c.local)}</h4><small>Lacre registrado: <b>${esc(c.lacre||'—')}</b> · ${S.p.filter(p=>p.local==c.local).length} item(ns)</small>${c.aberta?`<small class=lk>Aberta por ${esc(c.aberta_por||'—')} ${c.aberta_em?ha(c.aberta_em):''} · lacre informado: ${esc(c.lacre_rompido||'—')}${c.divergente?' ⚠ NÃO CONFERE':''}</small>`:''}<div class=g><button class="o dg" data-l="${esc(c.local)}" onclick="rmCx(this.dataset.l)">Remover caixa</button></div></div>`).join('')||'<p class=em>Nenhuma caixa cadastrada. Escolha um local abaixo e informe o número do lacre atual.</p>')
+`<div class=g><select id=cxl2>${livres.map(l=>`<option>${esc(l)}</option>`).join('')||'<option value="">Sem locais livres</option>'}</select><input id=cxn placeholder="Nº do lacre atual"><button onclick="addCx()">＋ Caixa</button></div>`
+`<h4 style="margin:14px 0 6px">Histórico de lacres</h4>`+(h.map(x=>`<div class=row style="align-items:flex-start"><span><b>${esc(x.local)}</b> · ${lab[x.evento]||x.evento}${x.evento=='abertura'?` (informou ${esc(x.informado||'—')}, registrado ${esc(x.lacre_anterior||'—')})${x.divergente?' <b style="color:#e5484d">⚠ não confere</b>':''}`:x.evento=='fechamento'?` (${esc(x.lacre_anterior||'—')} → <b>${esc(x.lacre_novo||'—')}</b>)`:x.evento=='cadastro'?` (lacre ${esc(x.lacre_novo||'—')})`:''}<small>${esc(x.usuario||'—')} · ${fd(+x.data)}</small></span></div>`).join('')||'<p class=em>Sem registros ainda.</p>')}
catch(e){el.innerHTML='<p class=em>Caixas ainda não habilitadas ou sem conexão ('+esc(e.message)+'). Rode o arquivo etapa2_lacres.sql no Supabase.</p>'}}
async function addCx(){const l=$('#cxl2').value,n=($('#cxn').value||'').trim();if(!l)return toast('Escolha um local.');if(!n)return toast('Informe o número do lacre atual.');try{await api('/rest/v1/rpc/cadastrar_caixa',{method:'POST',body:JSON.stringify({p_local:l,p_lacre:n})});toast('Caixa cadastrada.');loadCx()}catch(e){toast('Não foi possível cadastrar: '+e.message)}}
function rmCx(l){ask('Remover o controle de lacre de <b>'+esc(l)+'</b>? O histórico é mantido e o local continua existindo.',async()=>{try{await api('/rest/v1/rpc/remover_caixa',{method:'POST',body:JSON.stringify({p_local:l})});toast('Caixa removida.');loadCx()}catch(e){toast('Não foi possível remover: '+e.message)}},'Remover')}
function vCons(){$('main').innerHTML=`<div class=ph><h2>Consultar estoque</h2></div><div class=sr>${ic('search',18)}<input id=b placeholder="Buscar por nome, código, categoria ou local" value="${esc(busca)}" autocomplete=off></div><div class=chips>${[['todas','Todos'],['zero','Zerado']].map(([k,l])=>`<button class="${fl==k?'on':''}" onclick="fl='${k}';vCons()">${l}</button>`).join('')}<select onchange="sort=this.value;lista()">${[['nome','Nome'],['qtd','Menor quantidade'],['cat','Categoria']].map(([k,l])=>`<option value=${k} ${sort==k?'selected':''}>Ordenar: ${l}</option>`).join('')}</select></div><div id=ls></div>`;$('#b').oninput=e=>{busca=e.target.value;lista()};lista()}
function vMov(t){const e=t=='entrada';$('main').innerHTML=`<div class=ph><h2>Registrar ${e?'entrada':'saída'}</h2></div><div class=sr>${ic('search',18)}<input id=b placeholder="Buscar produto por nome ou código" value="${esc(busca)}" autocomplete=off></div><div id=ls></div>`;const b=$('#b');b.oninput=ev=>{busca=ev.target.value;listaMov(t)};b.onkeydown=ev=>{if(ev.key=='Enter'){const a=fp();if(a.length==1)mv(a[0].id,t);else if(!a.length)toast('Nenhum produto encontrado.')}};listaMov(t)}
function listaMov(t){const a=fp();$('#ls').innerHTML=a.map(p=>{const s=stt(p);return`<div class="pc ${s[0]}" onclick="mv('${p.id}','${t}')" style="cursor:pointer"><div class=pi><b>${esc(p.nome)}</b><small>${esc(p.categoria||'Sem categoria')} · ${esc(p.codigo||'sem código')} · ${esc(p.local||'sem local')}${selada(p.local)?' · 🔒 lacrada':''}</small></div><div class=pr><span class=q>${p.qtd} ${p.unidade}</span></div></div>`}).join('')||`<div class=em>${ic('box',34)}<p>Nenhum produto encontrado.</p></div>`}
function vConta(){$('main').innerHTML=`<div class=ph><h2>Conta</h2></div><div class=pn><p>Conta: <b>${esc(USR)}</b><br>Perfil: Operador<br>${esc($('#st').textContent||'')}</p><button class="o dg" onclick="sair()">Sair da conta</button></div>`}
boot();
</script></body></html>
